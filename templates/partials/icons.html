{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "search" %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
{%- elif name == "theme" %}<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
{%- elif name == "menu" %}<path d="M4 9h16M4 15h16"/>
{%- elif name == "close" %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == "arrow-right" %}<path d="M4 12h15m-5-5 5 5-5 5"/>
{%- elif name == "arrow-left" %}<path d="M20 12H5m5-5-5 5 5 5"/>
{%- elif name == "link" %}<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>
{%- elif name == "list" %}<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6" fill="currentColor"/><circle cx="4.5" cy="12" r=".6" fill="currentColor"/><circle cx="4.5" cy="18" r=".6" fill="currentColor"/>
{%- elif name == "external" %}<path d="M8 16 17 7m-8 0h8v8"/>
{%- endif -%}
</svg>
{%- endmacro %}
