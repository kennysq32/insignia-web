<!doctype html>
<html lang="{{ site.language }}" data-base="{{ site.base_url }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page_title %}{{ page_title }} — {{ site.title }}{% else %}{{ site.title }}{% if site.tagline %} — {{ site.tagline }}{% endif %}{% endif %}</title>
<meta name="description" content="{{ page_description or site.description }}">
<meta property="og:type" content="{{ og_type or 'website' }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page_title or site.title }}">
<meta property="og:description" content="{{ page_description or site.description }}">
{% if site.site_url %}
<meta property="og:url" content="{{ site.site_url.rstrip('/') ~ url }}">
{% if page_image and not page_image.endswith('.svg') %}<meta property="og:image" content="{{ site.site_url.rstrip('/') ~ page_image }}">{% endif %}
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.dataset.theme=t})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght,ROND@400..900,0..100&family=Geist+Mono:wght@400;500&family=Geist:wght@300..700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v={{ asset_version }}">
<script src="/assets/site.js?v={{ asset_version }}" defer></script>
</head>
<body class="mode-{{ mode or 'shell' }}">
<a class="skip" href="#main">Skip to content</a>
{% include "partials/header.html" %}
<main id="main">
{% block main %}{% endblock %}
</main>
{% include "partials/footer.html" %}
{% include "partials/search.html" %}
</body>
</html>
